<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Annie Pompa - Software Engineer at Cockroach Labs">
    <title>λ.  {{ page.title }}</title>
    <link rel="stylesheet" href="{{ site.baseurl }}/styles.css?v={{ site.time | date: '%s' }}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.1.0/fonts/remixicon.css" rel="stylesheet"/>
    <script>
        // Prevent lambda flash by setting initial state before page renders
        (function() {
            const storedPreference = localStorage.getItem('lambda_preference');
            if (storedPreference === 'AP') {
                document.documentElement.classList.add('lambda-toggled');
            }
        })();
    </script>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="text-cycle">
                <div class="flip-container">
                    <div class="flip-text"></div>
                </div>
            </div>
            <ul>
                <li><a href="/"><i class="ri-home-line"></i>home</a></li>
                <li><a href="/about"><i class="ri-user-line"></i>about</a></li>
                <li><a href="/work"><i class="ri-briefcase-line"></i>work</a></li>
                <li><a href="/education"><i class="ri-graduation-cap-line"></i>edu</a></li>
                <li><a href="/posts"><i class="ri-article-line"></i>posts</a></li>
                <li class="nav-divider"><div class="divider-line"></div></li>
                <li>
                    <div class="lambda-container">
                        <span class="lambda-text" data-text="λ">λ</span>
                        <span class="initials" data-text="ap">ap</span>
                    </div>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <div>
            <a href="https://github.com/annrpom" target="_blank"><i class="ri-github-line"></i></a>
            <a href="https://www.linkedin.com/in/annie-pompa/" target="_blank"><i class="ri-linkedin-line"></i></a>
            <a href="mailto:annierpompa@gmail.com"><i class="ri-mail-line"></i></a>
        </div>
        <p>© 2025 • Annie Pompa</p>
        <p class="credit">inspired by <a href="https://pawa.lt/" target="_blank">pawa.lt</a> (ty king)</p>
    </footer>

    <script>
        // Text cycle animation
        const texts = ["λm. λn. λf. λx. m f(n f x)", "λm. λn. λf. m(n f)", "λm. λn. n m"];
        let currentIndex = 0;
        const flipText = document.querySelector('.flip-text');

        // Lambda/AP toggle functionality
        const lambdaContainer = document.querySelector('.lambda-container');
        if (lambdaContainer) {
            // Get stored preference or default to 'λ'
            const storedPreference = localStorage.getItem('lambda_preference') || 'λ';
            if (storedPreference === 'AP') {
                lambdaContainer.classList.add('toggled');
                document.documentElement.classList.add('lambda-toggled');
            }

            // Toggle between 'λ' and 'AP' on click
            lambdaContainer.addEventListener('click', () => {
                lambdaContainer.classList.toggle('toggled');
                document.documentElement.classList.toggle('lambda-toggled');
                const isToggled = lambdaContainer.classList.contains('toggled');
                localStorage.setItem('lambda_preference', isToggled ? 'AP' : 'λ');
            });
        }

        function updateText() {
            const nextIndex = (currentIndex + 1) % texts.length;
            const nextText = texts[nextIndex];

            // Flip out
            flipText.style.transform = 'rotateX(90deg)';

            setTimeout(() => {
                flipText.textContent = nextText;
                // Flip in from the other side
                flipText.style.transition = 'none';
                flipText.style.transform = 'rotateX(-90deg)';

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        flipText.style.transition = 'transform 0.35s ease';
                        flipText.style.transform = 'rotateX(0deg)';
                    });
                });
            }, 350);

            currentIndex = nextIndex;
        }

        // Initial setup and start animation
        flipText.textContent = texts[0];
        setInterval(updateText, 6000);
    </script>
</body>
</html>
