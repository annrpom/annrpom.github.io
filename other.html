<div class="container">
    <div class="section">
        <h1 class="retro-text">Fun Stuff</h1>
        <div class="content">
            <p>Take a break and enjoy some retro gaming!</p>
        </div>
    </div>

    <div class="section game-section">
        <h2 class="retro-text">Retro Runner</h2>
        <div class="content">
            <div class="game-container">
                <div class="game">
                    <div id="player"></div>
                    <div id="obstacle"></div>
                    <div id="ground"></div>
                    <div class="score">Score: <span id="score">0</span></div>
                    <div class="game-over">
                        <h3>Game Over!</h3>
                        <p>Your Score: <span id="finalScore">0</span></p>
                    </div>
                </div>
                <div class="game-controls">
                    <p class="retro-text">Press SPACE to jump!</p>
                    <button id="startGame" class="retro-button">Start Game</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Game variables
    let player = document.getElementById('player');
    let obstacle = document.getElementById('obstacle');
    let ground = document.getElementById('ground');
    let scoreElement = document.getElementById('score');
    let finalScoreElement = document.getElementById('finalScore');
    let startButton = document.getElementById('startGame');
    let gameOverElement = document.querySelector('.game-over');
    let gameContainer = document.querySelector('.game');
    let isJumping = false;
    let isGameRunning = false;
    let score = 0;
    let gameLoop;

    // Only prevent space bar scrolling when game is active
    window.addEventListener('keydown', function(e) {
        if (e.code === 'Space' && isGameRunning) {
            e.preventDefault();
        }
    });

    // Game functions
    function jump() {
        if (!isJumping && isGameRunning) {
            isJumping = true;
            let position = 0;
            let jumpInterval = setInterval(() => {
                if (position >= 100) {
                    clearInterval(jumpInterval);
                    let fallInterval = setInterval(() => {
                        if (position <= 0) {
                            clearInterval(fallInterval);
                            isJumping = false;
                        } else {
                            position -= 5; // Increased gravity (was 3)
                        }
                        player.style.bottom = position + 'px';
                    }, 20);
                } else {
                    position += 5; // Increased jump speed (was 3)
                }
                player.style.bottom = position + 'px';
            }, 20);
        }
    }

    function moveObstacle() {
        let position = 100;
        let moveInterval = setInterval(() => {
            if (position <= -20) {
                position = 100;
                score++;
                scoreElement.textContent = score;
            }
            position -= 2;
            obstacle.style.left = position + '%';
            
            // Collision detection
            let playerBottom = parseInt(window.getComputedStyle(player).getPropertyValue('bottom'));
            let obstacleLeft = parseInt(window.getComputedStyle(obstacle).getPropertyValue('left'));
            
            if (obstacleLeft > 0 && obstacleLeft < 50 && playerBottom < 50) {
                gameOver();
            }
        }, 20);
        return moveInterval;
    }

    function gameOver() {
        isGameRunning = false;
        clearInterval(gameLoop);
        finalScoreElement.textContent = score;
        gameOverElement.style.display = 'block';
        startButton.textContent = 'Play Again';
        startButton.style.display = 'block';
    }

    function startGame() {
        if (!isGameRunning) {
            isGameRunning = true;
            score = 0;
            scoreElement.textContent = score;
            gameOverElement.style.display = 'none';
            startButton.style.display = 'none';
            gameLoop = moveObstacle();
        }
    }

    // Event listeners
    document.addEventListener('keydown', (event) => {
        if (event.code === 'Space') {
            jump();
        }
    });

    startButton.addEventListener('click', startGame);
</script>
