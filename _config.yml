title: annie pompa
description: NYC-based software engineer 
baseurl: ""
url: "https://annrpom.github.io"

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty
compress_html:
  clippings: all
  comments: all
  endings: all
  startings: [html, head, body]

# Performance settings
sass:
  style: compressed
incremental: true
exclude:
  - README.md
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Author information
author:
  name: Annie Pompa
  bio: Software Engineer at Cockroach Labs
  links:
    github: https://github.com/annrpom
    linkedin: https://www.linkedin.com/in/annie-pompa
    email: mailto:annierpompa@gmail.com

# Essential plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-include-cache 